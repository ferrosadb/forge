[package]
name = "forge-sheet-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
forge-tasks = { path = "../tasks" }
ureq = { version = "3", features = ["json"] }
dirs = { workspace = true }
# Pinned to the same major as the getrandom already pulled in transitively
# by the ureq -> rustls-platform-verifier -> ring chain (see Cargo.lock),
# to avoid a duplicate major version in the dependency graph.
getrandom = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
