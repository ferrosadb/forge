name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v0.13.5'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || '' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: frg-linux-x86_64
            binary: frg
            archive: tar.gz
          # Native arm64 Linux, not cross-compilation. This job builds with a
          # plain `cargo build --release` and then RUNS the binary to smoke
          # test it; a cross-compiled aarch64 binary cannot be executed on an
          # x86_64 runner, so the check that the artifact actually works would
          # have to be dropped exactly where it matters most.
          #
          # ferrosa-installer's vz target is the Apple Virtualization Linux
          # guest, which is aarch64. Without this artifact it reports forge
          # unpinned and the image cannot be built.
          - os: ubuntu-24.04-arm
            artifact: frg-linux-aarch64
            binary: frg
            archive: tar.gz
          - os: macos-14
            artifact: frg-macos-aarch64
            binary: frg
            archive: tar.gz
          - os: windows-latest
            artifact: frg-windows-x86_64
            binary: frg.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The tag and the crate version must agree, BEFORE anything is built.
      #
      # `frg --version` reads the crate version, and the smoke test below only
      # checks that it answers — never that it answers the tag. So a v0.18.1
      # release could ship a binary reporting 0.18.0, and nothing here would
      # notice. Downstream that is not cosmetic: ferrosa-installer's staleness
      # check believes what the binary says, so it would decline to replace a
      # build that is in fact stale.
      #
      # ferrosa-streamer and ferrosa-coordinator both fail their release on
      # this. forge did not, which is why bumping Cargo.toml before tagging was
      # something to remember rather than something enforced — and why v0.18.0
      # was cut, then needed a hand-made 0.18.1 to carry an artifact added
      # after it.
      #
      # Checked at the top of the job so the answer costs seconds rather than a
      # full matrix build across four platforms.
      - name: Check the tag and the crate version agree
        shell: bash
        run: |
          tag_name="${{ inputs.tag || github.ref_name }}"
          crate_version="$(
            sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -1
          )"
          if [[ -z "$crate_version" ]]; then
            echo "ERROR: could not read the workspace version from Cargo.toml" >&2
            exit 1
          fi
          echo "crate version: $crate_version"
          echo "tag:           ${tag_name:-<none>}"
          # A branch dispatch with no tag input builds without publishing, so
          # there is nothing to disagree with. Say so rather than passing mutely.
          if [[ -z "${{ inputs.tag }}" && "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "NOTE: not a tag build; version agreement not enforced"
            exit 0
          fi
          if [[ "$tag_name" != "v${crate_version}" ]]; then
            echo "ERROR: tag $tag_name does not match crate version $crate_version" >&2
            echo "       Bump [workspace.package] version in Cargo.toml to ${tag_name#v}," >&2
            echo "       or tag v${crate_version} instead." >&2
            exit 1
          fi
          echo "tag and crate version agree"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-25
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build release binary
        run: cargo build --release --bin frg
      - name: Smoke test binary
        shell: bash
        run: |
          ./target/release/${{ matrix.binary }} --version
          ./target/release/${{ matrix.binary }} --help >/dev/null
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p package
          cp target/release/${{ matrix.binary }} package/frg
          cp README.md LICENSE package/
          tar -C package -czf ${{ matrix.artifact }}.tar.gz .
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target/release/${{ matrix.binary }} package/frg.exe
          Copy-Item README.md package/README.md
          Copy-Item LICENSE package/LICENSE
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- ./* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 && {
            echo "Release $TAG_NAME already exists; refusing to mutate immutable release artifacts" >&2
            exit 1
          }
          gh release create "$TAG_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG_NAME" \
            --generate-notes
